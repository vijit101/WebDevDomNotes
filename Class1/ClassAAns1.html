<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button>Click Me </button>

    
    <script>
        let btn =  document.querySelector("button"); // getting button 
        let bdy = document.querySelector("body");
        let newParagraph = document.createElement("p");// creating new para 
        newParagraph.textContent = "This paragraph was created dynamically!";
        btn.addEventListener('click',()=>{
            
            bdy.appendChild(newParagraph)});

        

    </script>
</body>
</html>
